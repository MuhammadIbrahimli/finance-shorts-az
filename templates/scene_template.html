<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>video</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
  SCENE CONTRACT (scripts/render.py relies on it):
  - window.renderAt(t): draws the frame at time t in seconds. Pure function of t:
    no state carried between calls, no real-time animation loops, no unseeded randomness.
  - window.DURATION_SEC: length of the video (narration + short tail), set below.
  - window.WORDS: [{w, s, e}] from work/words.json (the script text, timed). Paste the
    generated array here; subtitles are burned in by drawSubtitles().

  Replace the placeholder scene with the paper-collage scene from AGENTS.md
  (storyboard in work/storyboard.md). Keep drawSubtitles() on top of every frame.
*/
window.DURATION_SEC = 30;
window.WORDS = [];

const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---- subtitle spec from AGENTS.md ("Уроки правок → Субтитры") ----
const SUB = {
  font: '700 52px Arial',
  centerY: 1540,          // centre of the plate, px from top (never below ~1600)
  maxGroupWidth: 820,
  maxWords: 3,
  padX: 17, padY: 17, radius: 13,
  plate: 'rgba(18,22,28,0.5)',
  word: '#f7f2e6',
  active: '#ffdc45',
};

// Group consecutive words into karaoke groups: at most 3 words, group width <= 820 px.
function subtitleGroups() {
  ctx.font = SUB.font;
  const groups = [];
  let cur = [];
  for (const word of window.WORDS) {
    const trial = [...cur, word];
    const width = ctx.measureText(trial.map(x => x.w).join(' ')).width;
    if (cur.length && (trial.length > SUB.maxWords || width > SUB.maxGroupWidth)) {
      groups.push(cur);
      cur = [word];
    } else {
      cur = trial;
    }
  }
  if (cur.length) groups.push(cur);
  return groups;
}
const GROUPS = subtitleGroups();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSubtitles(t) {
  const group = GROUPS.find(g => t >= g[0].s && t < g[g.length - 1].e + 0.05);
  if (!group) return;
  ctx.font = SUB.font;
  ctx.textBaseline = 'middle';
  const text = group.map(x => x.w).join(' ');
  const textW = ctx.measureText(text).width;
  const plateW = textW + SUB.padX * 2;
  const plateH = 52 * 1.25 + SUB.padY * 2;
  const x0 = (W - plateW) / 2, y0 = SUB.centerY - plateH / 2;
  ctx.fillStyle = SUB.plate;
  roundRect(x0, y0, plateW, plateH, SUB.radius);
  ctx.fill();
  let x = x0 + SUB.padX;
  for (let i = 0; i < group.length; i++) {
    const word = group[i];
    const active = t >= word.s && t < word.e;
    ctx.fillStyle = active ? SUB.active : SUB.word;
    ctx.fillText(word.w, x, SUB.centerY);
    x += ctx.measureText(word.w + (i < group.length - 1 ? ' ' : '')).width;
  }
}

// ---- placeholder scene: replace with the real paper-collage frame ----
function drawScene(t) {
  ctx.fillStyle = '#2b3446';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e9d9b8';
  ctx.font = '800 96px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('PLACEHOLDER', W / 2, 800);
  ctx.textAlign = 'left';
}

window.renderAt = function (t) {
  ctx.clearRect(0, 0, W, H);
  drawScene(t);
  drawSubtitles(t);
};
window.renderAt(0);
</script>
</body>
</html>
